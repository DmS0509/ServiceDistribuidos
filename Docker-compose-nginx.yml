#Docker compose para balanceador nginx y 3 contenedores de calculadora

services:

  calc-A-0:
    image: calculadora:latest
    container_name: calc-A-0
    environment:
      CONTAINER_NAME: calc-A-0
    ports:
    - "30000:8080"
    restart: unless-stopped

  calc-A-1:
    image: calculadora:latest
    container_name: calc-A-1
    environment:
      CONTAINER_NAME: calc-A-1
    ports:
      - "30001:8080"
    restart: unless-stopped

  calc-A-2:
    image: calculadora:latest
    container_name: calc-A-2
    environment:
      CONTAINER_NAME: calc-A-2
    ports:
      - "30002:8080"
    restart: unless-stopped

  nginx-balancer:
    image: nginx:alpine
    container_name: nginx-balancer
    ports:
      - "8020:8020"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - calc-A-0
      - calc-A-1
      - calc-A-2
    restart: unless-stopped